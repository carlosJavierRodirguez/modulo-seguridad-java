spring:
  application:
    name: security-module

  datasource:
    username: postgres
    url: jdbc:postgresql://localhost:5432/modulo_seguridad_java
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
      show-sql: true
    properties:
      hibernate:
        format_sql: true